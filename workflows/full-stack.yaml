name: full-stack
description: Full-stack workflow with optional specialist agents (requires custom agents in ~/.claude/agents/)

phases:
  - planner
  - architect
  - frontend-coder
  - backend-coder
  - reviewer
  - security-reviewer
  - ui-tester
  - integration-tester

retry_policy:
  planner:
    max_attempts: 3
  architect:
    max_attempts: 3
  frontend-coder:
    max_attempts: 3
  backend-coder:
    max_attempts: 3
  reviewer:
    max_attempts: 3
  security-reviewer:
    max_attempts: 3
  ui-tester:
    max_attempts: 3
  integration-tester:
    max_attempts: 3
